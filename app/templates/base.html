<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}USCaseMonitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="/">USCaseMonitor</a>
    <nav><a href="/">看板</a><a href="/customers">客户</a><a href="/rules">提醒规则</a><a href="/notifications">提醒记录</a><a href="/settings">系统配置</a></nav>
    <form action="/logout" method="post"><button class="link-button">退出</button></form>
  </header>
  <main>
    {% if message %}<div class="flash">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
